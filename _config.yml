title: 我的博客
subtitle: 把学到的，慢慢写下来。
description: 技术、学习与日常的个人记录。
keywords: 技术,学习,个人博客
author: CGDIYA
language: zh-CN
timezone: Asia/Shanghai
url: https://cgdiya.github.io
root: /
permalink: posts/:title/
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: false
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - .nojekyll
new_post_name: :title.md
default_layout: post
auto_spacing: false
titlecase: false
external_link:
  enable: true
  field: site
  exclude: []
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: false
syntax_highlighter: highlight.js
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: '  '
  wrap: true
  hljs: false
index_generator:
  path: ''
  per_page: 6
  order_by: -date
default_category: 随笔
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: date
per_page: 10
pagination_dir: page
theme: butterfly
search:
  path: search.xml
  field: post
  content: true
  format: html
feed:
  enable: false
